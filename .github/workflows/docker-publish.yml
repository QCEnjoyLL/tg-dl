name: Build and Publish Docker Image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms, comma separated (arm64 compiles PyTgCrypto under QEMU and is slow)"
        required: false
        default: "linux/amd64"
      push_image:
        description: "Push the built image to GHCR (true/false)"
        required: false
        default: "true"
      create_release:
        description: "Create the GitHub Release for __version__ (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all sources
        run: python -m compileall -q media_downloader.py module utils scripts

  # Single source of truth: utils/__init__.py. The image tag, the git tag and
  # the GitHub Release all come from this job, so they can never drift apart.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    needs: python-syntax
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      major_minor: ${{ steps.read.outputs.major_minor }}
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Read __version__
        id: read
        run: |
          set -eu
          VERSION="$(python3 scripts/release.py --print-version)"
          TAG="v${VERSION}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          # A hand-pushed tag has to describe the code it points at, otherwise
          # the release, the image tag and the running code disagree.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 utils/__init__.py 的版本 ${TAG} 不一致"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "major_minor=${VERSION%.*}"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "${TAG} -> ${IMAGE}"

      - name: Validate the CHANGELOG section
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -eu
          # Fail before the expensive image build when the release body would be
          # empty, otherwise the run leaves a pushed image without a release.
          python3 scripts/release.py --version "$VERSION" >/dev/null
          echo "v${VERSION} 的更新日志章节存在"

  # Publishing used to depend only on "does it compile": a red test suite could
  # still produce an image and a release. The suite runs here as a gate instead.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          make dev_install

      - name: Run tests
        run: pytest -q --tb=short tests/

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [python-syntax, version, tests]
    outputs:
      pushed: ${{ steps.cfg.outputs.push }}
      platforms: ${{ steps.cfg.outputs.platforms }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build settings
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          INPUT_PUSH: ${{ github.event.inputs.push_image }}
        run: |
          set -eu
          if [ -n "${INPUT_PLATFORMS:-}" ]; then
            PLATFORMS="$INPUT_PLATFORMS"
          else
            PLATFORMS="linux/amd64"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PUSH="false"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PUSH="${INPUT_PUSH:-true}"
          else
            PUSH="true"
          fi

          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "building ${{ needs.version.outputs.image }} for $PLATFORMS (push=$PUSH)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}
          # Version tags come from `type=semver`, which only matches a tag ref.
          # A branch push must never overwrite `X.Y.Z` — that is how the image a
          # release points at silently changed under the same version number.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Deliberately no `labels:` — metadata-action derives
          # org.opencontainers.image.version from the first tag, which on a
          # branch build is "master", and --label beats the Dockerfile LABEL.
          # The Dockerfile stamps the real version from the VERSION build arg.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The label is how `docker inspect` answers "which version is this?", so
      # assert it instead of trusting the build args. Only a tag build produces
      # the `X.Y.Z` tag this check pulls.
      - name: Verify the image labels
        if: steps.cfg.outputs.push == 'true' && github.ref_type == 'tag'
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          docker pull --quiet "${IMAGE}:${VERSION}"
          LABEL_VERSION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}:${VERSION}")"
          LABEL_REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:${VERSION}")"
          echo "org.opencontainers.image.version=${LABEL_VERSION}"
          echo "org.opencontainers.image.revision=${LABEL_REVISION}"
          if [ "${LABEL_VERSION}" != "${VERSION}" ]; then
            echo "::error::镜像版本标签是 ${LABEL_VERSION}，期望 ${VERSION}"
            exit 1
          fi
          if [ "${LABEL_REVISION}" != "${SHA}" ]; then
            echo "::error::镜像 revision 标签是 ${LABEL_REVISION}，期望 ${SHA}"
            exit 1
          fi

  # Runs only after the image is actually published: a release whose image was
  # never pushed is worse than no release at all. Only a tag build produces the
  # versioned image this release advertises, and a version tag must be immutable.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, docker]
    if: |
      github.ref_type == 'tag' &&
      needs.docker.outputs.pushed == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.create_release != 'false')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ needs.version.outputs.image }}
          PLATFORMS: ${{ needs.docker.outputs.platforms }}
        run: |
          set -eu
          python3 scripts/release.py \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --image "$IMAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --platforms "$PLATFORMS" \
            --output release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          # A tag that already exists must describe this exact commit: the image
          # was built from GITHUB_SHA, so a tag pointing elsewhere would publish
          # notes for code that is not in the image.
          REMOTE_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          fi
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::tag ${TAG} 指向 ${REMOTE_SHA}，与本次构建的 ${GITHUB_SHA} 不一致"
            exit 1
          fi

          # Releases are immutable: republishing the same version silently would
          # make the tag, the image and the notes disagree. Bump __version__.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} 已存在；版本号不可变，请提升 utils/__init__.py 的版本后重新打 tag"
            exit 1
          fi

          if [ -n "$REMOTE_SHA" ]; then
            echo "tag ${TAG} 已存在且指向本次提交，基于它创建 release"
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          IMAGE: ${{ needs.version.outputs.image }}
          TAGS: ${{ needs.docker.outputs.tags }}
          PLATFORMS: ${{ needs.docker.outputs.platforms }}
        run: |
          {
            echo "### v${VERSION}"
            echo ""
            echo "- release: \`${TAG}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- platforms: \`${PLATFORMS}\`"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
