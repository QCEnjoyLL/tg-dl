name: Tests (non-blocking)

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "README_CN.md"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "README_CN.md"

jobs:
  test:
    runs-on: ubuntu-latest
    # The upstream test-suite does not pass in this environment and was already
    # red before this fork diverged. Keep running it for reference, but never
    # let it mark the branch red: the required gate is the image build.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    name: Test - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          make dev_install

      - name: Run tests
        run: |
          mkdir -p /tmp/coverage
          make -e test || pytest -x --tb=short tests/
