name: Tests

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "README_CN.md"
      - "docs/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "README_CN.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    name: Test - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          make dev_install

      - name: Compile all sources
        run: python -m compileall -q media_downloader.py module utils scripts

      # E9 catches syntax errors, F catches undefined names and dead imports:
      # both are real bugs, so keep them at zero instead of letting them rot.
      - name: Lint
        run: ruff check --select E9,F media_downloader.py module utils scripts tests

      - name: Run tests
        run: pytest -q --tb=short tests/
