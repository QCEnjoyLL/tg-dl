<!DOCTYPE html>
<html lang="zh-CN" data-version="{{ version }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · TeleVault</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232a56d6'/%3E%3Cstop offset='1' stop-color='%237b96ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='15' r='8.2' fill='none' stroke='%23ffffff' stroke-opacity='.45' stroke-width='1.8'/%3E%3Cpath d='M16 9.5v8.2m-3.5-3.3 3.5 3.5 3.5-3.5M9.2 25h13.6' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="{{ url_for('static', filename='css/app.css', v=version) }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/login.css', v=version) }}" rel="stylesheet">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('tgdl-theme');
        var theme = q || saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#main">跳到登录表单</a>

  <button class="icon-btn auth-theme" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
    <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </button>

  <main class="auth" id="main">
    <form class="auth-card" id="login-form" autocomplete="on" novalidate>
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="11" r="6.4" stroke-opacity="0.5" stroke-width="1.7" />
            <path d="M12 7v6" />
            <path d="m9.4 10.4 2.6 2.6 2.6-2.6" />
            <path d="M7.2 19.6h9.6" />
          </svg>
      </span>

      <h1>TeleVault</h1>
      <p class="auth-tagline">Telegram 媒体归档 · 下载与云端同步</p>
      <p>请输入访问密码继续</p>

      <div class="field">
        <label for="password">访问密码</label>
        <input id="password" name="password" type="password" placeholder="访问密码" autocomplete="current-password"
          aria-describedby="error auth-hint" autofocus>
      </div>

      <button class="btn btn-primary" type="submit" id="submit-btn">
        <span id="submit-label">登录</span>
      </button>

      <div class="auth-error" id="error" role="alert"></div>
      <div class="auth-hint" id="auth-hint">密码来自 config.yaml 的 web_login_secret；请通过 HTTPS 访问。</div>
    </form>
  </main>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("login-form");
      var input = document.getElementById("password");
      var error = document.getElementById("error");
      var button = document.getElementById("submit-btn");
      var label = document.getElementById("submit-label");

      function fail(message) {
        error.textContent = message;
        form.classList.remove("shake");
        void form.offsetWidth;
        form.classList.add("shake");
        input.setAttribute("aria-invalid", "true");
        input.focus();
      }

      function clearError() {
        error.textContent = "";
        input.removeAttribute("aria-invalid");
      }

      input.addEventListener("input", clearError);

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
      }

      document.getElementById("theme-toggle").addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem("tgdl-theme", next);
        } catch (e) { /* private mode */ }
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearError();

        var value = input.value.trim();
        if (!value) {
          fail("请输入密码");
          return;
        }

        button.disabled = true;
        label.textContent = "登录中…";

        var body = new URLSearchParams();
        // HTTPS is the transport security boundary; client-side crypto with a
        // key shipped in this page was only obfuscation.
        body.set("password", value);

        fetch("login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            if (data && data.code === "1") {
              window.location.href = "/";
              return;
            }
            fail(data && data.msg ? data.msg : "密码错误，请重试");
            input.value = "";
          })
          .catch(function () {
            fail("无法连接服务器");
          })
          .finally(function () {
            button.disabled = false;
            label.textContent = "登录";
          });
      });
    })();
  </script>
</body>

</html>
