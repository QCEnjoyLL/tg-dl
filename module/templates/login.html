<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · tg-dl</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f5fe0'/%3E%3Cpath d='M16 8v11m0 0 4.5-4.5M16 19l-4.5-4.5M10 23h12' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('tgdl-theme');
        var theme = q || saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <button class="icon-btn auth-theme" id="theme-toggle" type="button" aria-label="切换明暗主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </button>

  <main class="auth">
    <form class="auth-card" id="login-form" autocomplete="on">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 3v11" />
          <path d="M7.5 10.5 12 15l4.5-4.5" />
          <path d="M4 19h16" />
        </svg>
      </div>

      <h1>Telegram Media Downloader</h1>
      <p>请输入访问密码</p>

      <div class="field">
        <input id="password" name="password" type="password" placeholder="访问密码" autocomplete="current-password"
          autofocus>
      </div>

      <button class="btn" type="submit" id="submit-btn">
        <span id="submit-label">登录</span>
      </button>

      <div class="auth-error" id="error" role="alert"></div>
      <div class="auth-hint">密码来自 config.yaml 的 web_login_secret；请通过 HTTPS 访问</div>
    </form>
  </main>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("login-form");
      var input = document.getElementById("password");
      var error = document.getElementById("error");
      var button = document.getElementById("submit-btn");
      var label = document.getElementById("submit-label");

      function fail(message) {
        error.textContent = message;
        form.classList.remove("shake");
        void form.offsetWidth;
        form.classList.add("shake");
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
      }

      document.getElementById("theme-toggle").addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem("tgdl-theme", next);
        } catch (e) {}
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        error.textContent = "";

        var value = input.value.trim();
        if (!value) {
          fail("请输入密码");
          input.focus();
          return;
        }

        button.disabled = true;
        label.textContent = "登录中…";

        var body = new URLSearchParams();
        // HTTPS is the transport security boundary; client-side crypto with a
        // key shipped in this page was only obfuscation.
        body.set("password", value);

        fetch("login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            if (data && data.code === "1") {
              window.location.href = "/";
              return;
            }
            fail("密码错误，请重试");
            input.value = "";
            input.focus();
          })
          .catch(function () {
            fail("无法连接服务器");
          })
          .finally(function () {
            button.disabled = false;
            label.textContent = "登录";
          });
      });
    })();
  </script>
</body>

</html>
