<!DOCTYPE html>
<html lang="zh-CN" data-version="{{ version }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · TeleVault</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1c21'/%3E%3Cpath d='M9 17.5V22a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 23 22v-4.5' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 8.5v9.5m-4-3.8 4 4 4-4' fill='none' stroke='%23a5b4fc' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="{{ url_for('static', filename='css/app.css', v=version) }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/login.css', v=version) }}" rel="stylesheet">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('tgdl-theme');
        var theme = q || saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#main">跳到登录表单</a>

  <div class="auth-shell">
    <div class="auth-topbar">
      <button class="icon-btn auth-theme" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
        <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </div>

    <main class="auth" id="main" tabindex="-1">
      <form class="auth-card" id="login-form" autocomplete="on" novalidate>
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M5 14.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-4.5" />
              <path d="M12 4.5v10.5" />
              <path d="m8.2 11.2 3.8 3.8 3.8-3.8" />
            </svg>
          </span>
          <div>
            <h1>TeleVault</h1>
            <p class="auth-tagline">Telegram 媒体归档 · 下载与云端同步</p>
          </div>
        </div>

        <div class="field">
          <label for="password">访问密码</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password"
              aria-describedby="auth-hint" autofocus>
            <button class="pw-toggle" id="pw-toggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
              <svg class="icon-eye" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye-off" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.4 0 10 8 10 8a17.6 17.6 0 0 1-3.2 4.3" />
                <path d="M6.6 6.6A17.2 17.2 0 0 0 2 12s3.6 8 10 8a9.8 9.8 0 0 0 5.4-1.6" />
                <path d="M14.1 14.1a3 3 0 0 1-4.2-4.2" />
                <path d="m2 2 20 20" />
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary" type="submit" id="submit-btn">
          <span id="submit-label">登录</span>
        </button>

        <div class="auth-error" id="error" role="alert"></div>
        <div class="auth-hint" id="auth-hint">密码来自 config.yaml 的 web_login_secret；请通过 HTTPS 访问。</div>
      </form>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("login-form");
      var input = document.getElementById("password");
      var pwToggle = document.getElementById("pw-toggle");
      var error = document.getElementById("error");
      var button = document.getElementById("submit-btn");
      var label = document.getElementById("submit-label");
      var themeBtn = document.getElementById("theme-toggle");
      var submitting = false;

      function syncThemeLabel(theme) {
        var text = theme === "dark" ? "切换到浅色主题" : "切换到深色主题";
        themeBtn.setAttribute("aria-label", text);
        themeBtn.title = text;
      }

      syncThemeLabel(document.documentElement.dataset.theme === "dark" ? "dark" : "light");

      function fail(message) {
        error.textContent = message;
        form.classList.remove("shake");
        void form.offsetWidth;
        form.classList.add("shake");
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", "error auth-hint");
        input.focus();
      }

      function clearError() {
        error.textContent = "";
        input.removeAttribute("aria-invalid");
        input.setAttribute("aria-describedby", "auth-hint");
      }

      input.addEventListener("input", clearError);

      pwToggle.addEventListener("click", function () {
        var visible = input.type === "text";
        input.type = visible ? "password" : "text";
        pwToggle.setAttribute("aria-pressed", visible ? "false" : "true");
        var nextLabel = visible ? "显示密码" : "隐藏密码";
        pwToggle.setAttribute("aria-label", nextLabel);
        pwToggle.title = nextLabel;
        input.focus();
      });

      themeBtn.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.classList.add("theme-switching");
        document.documentElement.dataset.theme = next;
        syncThemeLabel(next);
        void document.documentElement.offsetWidth;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.documentElement.classList.remove("theme-switching");
          });
        });
        try {
          localStorage.setItem("tgdl-theme", next);
        } catch (e) { /* private mode */ }
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (submitting) return;
        clearError();

        var value = input.value.trim();
        if (!value) {
          fail("请输入密码");
          return;
        }

        submitting = true;
        button.setAttribute("aria-disabled", "true");
        label.textContent = "登录中…";

        var body = new URLSearchParams();
        body.set("password", value);

        fetch("login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        })
          .then(function (res) {
            if (!res.ok) throw new Error("服务器错误（HTTP " + res.status + "）");
            return res.json();
          })
          .then(function (data) {
            if (data && data.code === "1") {
              label.textContent = "正在跳转…";
              window.location.href = "/";
              return;
            }
            submitting = false;
            button.removeAttribute("aria-disabled");
            label.textContent = "登录";
            fail(data && data.msg ? data.msg : "密码错误，请重试");
            input.value = "";
          })
          .catch(function (err) {
            submitting = false;
            button.removeAttribute("aria-disabled");
            label.textContent = "登录";
            fail(err && err.message && err.message.indexOf("HTTP ") !== -1 ? err.message : "无法连接服务器，请检查网络或服务状态");
          });
      });
    })();
  </script>
</body>

</html>
