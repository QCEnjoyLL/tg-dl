<!DOCTYPE html>
<html lang="zh-CN" data-version="{{ version }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TeleVault · 后台</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232a56d6'/%3E%3Cstop offset='1' stop-color='%237b96ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='15' r='8.2' fill='none' stroke='%23ffffff' stroke-opacity='.45' stroke-width='1.8'/%3E%3Cpath d='M16 9.5v8.2m-3.5-3.3 3.5 3.5 3.5-3.5M9.2 25h13.6' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="{{ url_for('static', filename='css/app.css', v=version) }}" rel="stylesheet">
  <script>
    /* Apply the theme before first paint so there is no white flash. */
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('tgdl-theme');
        var theme = q || saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="app-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="11" r="6.4" stroke-opacity="0.5" stroke-width="1.7" />
            <path d="M12 7v6" />
            <path d="m9.4 10.4 2.6 2.6 2.6-2.6" />
            <path d="M7.2 19.6h9.6" />
          </svg>
        </span>
        <h1 class="brand-name">TeleVault</h1>
        <span class="chip" title="当前版本">v{{ version }}</span>
      </div>

      <div class="header-actions">
        <div class="speed-pill" title="当前下载速度">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14" />
            <path d="m6 13 6 6 6-6" />
          </svg>
          <span id="speed">--</span>
        </div>

        <button class="icon-btn" id="config-btn" type="button" aria-label="编辑配置" title="编辑配置">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z" />
          </svg>
        </button>

        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>

        {% if login_enabled %}
        <button class="icon-btn" id="logout-btn" type="button" aria-label="退出登录" title="退出登录">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
        {% endif %}

        <button class="btn btn-primary" id="pause-btn" data-value="{{ download_state }}" type="button">
          <span class="pause-label">暂停</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="stats" aria-label="概览">
      <div class="stat">
        <span class="stat-label">下载中</span>
        <strong class="stat-value" id="stat-active">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">已完成</span>
        <strong class="stat-value" id="stat-done">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">失败</span>
        <strong class="stat-value is-danger" id="stat-failed">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">状态</span>
        <strong class="stat-value" id="stat-state">运行中</strong>
      </div>
    </section>

    <section class="panel" aria-label="任务列表">
      <div class="panel-head">
        <div class="tabs" role="tablist" aria-label="任务分类">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="downloading">
            下载中
            <span class="badge" id="badge-downloading" hidden>0</span>
          </button>
          <button class="tab" role="tab" aria-selected="false" data-tab="downloaded">
            已完成
            <span class="badge" id="badge-done" hidden>0</span>
          </button>
          <button class="tab" role="tab" aria-selected="false" data-tab="failed">
            失败
            <span class="badge is-danger" id="badge-failed" hidden>0</span>
          </button>
        </div>

        <div class="panel-meta">
          <span class="live-dot" id="live-dot" aria-hidden="true"></span>
          <span id="updated">正在连接…</span>
        </div>
      </div>

      <div class="table-scroll" id="table-scroll" tabindex="0" role="region" aria-label="任务表格">
        <table class="table" id="table-downloading">
          <thead>
            <tr>
              <th class="col-id" scope="col">ID</th>
              <th scope="col">文件名</th>
              <th class="col-size" scope="col">大小</th>
              <th class="col-progress" scope="col">进度</th>
              <th class="col-speed" scope="col">速度</th>
              <th class="col-actions" scope="col">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <table class="table" id="table-downloaded" hidden>
          <thead>
            <tr>
              <th class="col-id" scope="col">ID</th>
              <th scope="col">文件名</th>
              <th class="col-size" scope="col">大小</th>
              <th class="col-time" scope="col">完成时间</th>
              <th class="col-path" scope="col">保存路径</th>
              <th class="col-actions" scope="col">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <table class="table" id="table-failed" hidden>
          <thead>
            <tr>
              <th class="col-id" scope="col">ID</th>
              <th scope="col">文件名</th>
              <th class="col-time" scope="col">失败时间</th>
              <th class="col-actions" scope="col">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="empty" id="empty" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5.5" />
          <path d="m8 10 4 4 4-4" />
          <path d="M12 3v11" />
        </svg>
        <p id="empty-text">暂无任务</p>
      </div>
    </section>
  </main>

  <dialog class="dialog dialog-wide" id="config-dialog" aria-labelledby="config-title">
    <div class="dialog-head">
      <div>
        <h2 class="dialog-title" id="config-title">编辑配置</h2>
        <p class="dialog-sub" id="config-path">config.yaml</p>
      </div>
      <button class="icon-btn" type="button" id="config-close" aria-label="关闭配置面板">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <div class="dialog-tabs" role="tablist" aria-label="配置编辑方式">
      <button class="tab is-active" role="tab" aria-selected="true" data-cfg-tab="form" id="cfg-tab-form"
        type="button">表单</button>
      <button class="tab" role="tab" aria-selected="false" data-cfg-tab="yaml" id="cfg-tab-yaml"
        type="button">YAML 原文</button>
    </div>

    <div class="dialog-body" id="config-form-pane">
      <p class="dialog-loading" id="config-loading">正在读取 config.yaml…</p>
      <form id="config-form" novalidate></form>
    </div>

    <div class="dialog-body dialog-body--yaml" id="config-yaml-pane" hidden>
      <label class="sr-only" for="config-text">config.yaml 内容</label>
      <textarea class="config-text" id="config-text" spellcheck="false" autocomplete="off"
        aria-describedby="config-hint" wrap="soft"></textarea>
      <p class="dialog-hint" id="config-hint">
        api_hash / bot_token / web_login_secret / 代理密码以 <code>********</code> 显示，保持原样即不会覆盖。
        保存会先校验 YAML，再原子写入文件。
      </p>
    </div>

    <div class="dialog-foot">
      <span class="dialog-error" id="config-error" role="alert"></span>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="config-cancel">取消</button>
        <button class="btn btn-primary" type="button" id="config-save">保存</button>
      </div>
    </div>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js', v=version) }}"></script>
</body>

</html>
