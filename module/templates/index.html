<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>tg-dl · Telegram Media Downloader</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f5fe0'/%3E%3Cpath d='M16 8v11m0 0 4.5-4.5M16 19l-4.5-4.5M10 23h12' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <script>
    /* Apply the theme before first paint so there is no white flash. */
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('tgdl-theme');
        var theme = q || saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <header class="app-header">
    <div class="wrap header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v11" />
            <path d="M7.5 10.5 12 15l4.5-4.5" />
            <path d="M4 19h16" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>tg-dl</h1>
          <span class="chip">{{ version }}</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="speed-pill" title="当前下载速度">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14" />
            <path d="m6 13 6 6 6-6" />
          </svg>
          <span id="speed">--</span>
        </div>

        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>

        <button class="btn" id="pause-btn" data-value="{{ download_state }}" type="button">
          <span class="pause-label">暂停</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" aria-label="概览">
      <div class="stat">
        <span class="stat-label">下载中</span>
        <strong id="stat-active">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">失败</span>
        <strong id="stat-failed" class="is-danger">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">当前速度</span>
        <strong id="stat-speed">--</strong>
      </div>
      <div class="stat">
        <span class="stat-label">状态</span>
        <strong id="stat-state">运行中</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="tabs" role="tablist" aria-label="任务分类">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="downloading">
            下载中
            <span class="badge" id="badge-downloading" hidden>0</span>
          </button>
          <button class="tab" role="tab" aria-selected="false" data-tab="downloaded">已完成</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="failed">
            失败
            <span class="badge is-danger" id="badge-failed" hidden>0</span>
          </button>
        </div>

        <div class="panel-meta">
          <span class="live-dot" id="live-dot" aria-hidden="true"></span>
          <span id="updated">正在连接…</span>
        </div>
      </div>

      <div class="table-scroll" id="table-scroll">
        <table class="table" id="table-downloading">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>文件名</th>
              <th class="col-size">大小</th>
              <th class="col-progress">进度</th>
              <th class="col-speed">速度</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <table class="table" id="table-downloaded" hidden>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>文件名</th>
              <th class="col-size">大小</th>
              <th>保存路径</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <table class="table" id="table-failed" hidden>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>文件名</th>
              <th class="col-time">失败时间</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5.5" />
          <path d="m8 10 4 4 4-4" />
          <path d="M12 3v11" />
        </svg>
        <p id="empty-text">暂无任务</p>
      </div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
